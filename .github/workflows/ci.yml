name: CI & QA

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: ESLint Check
        run: npx eslint js/

      - name: Start Local Test Server
        run: npx serve . -p 8080 &
        env:
          PORT: 8080

      - name: Wait for server
        run: sleep 3

      - name: Run Playwright Verification Script
        run: node tests/verify-hypervisor.mjs
